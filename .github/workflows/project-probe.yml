name: Project probe

on:
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: alanmasu/action_on_develop_labeler@main
        with:
          project-url: https://github.com/users/alanmasu/projects/11
          project-token: ${{ secrets.PROJECT_TOKEN }}
          status-on-develop: __probe_list_options__
